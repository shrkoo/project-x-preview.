<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1014"><title>Instagram • Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0c1014;--bar:#10151b;--panel:#171e26;--muted:#8c969f;--line:#222b34;--blue:#3797f0;--red:#ff3040}*{box-sizing:border-box}body{margin:0;background:#070a0e;color:#fff;font-family:Arial,Tahoma,sans-serif}button,input{font:inherit}button{color:inherit;border:0;background:none;cursor:pointer}.app{width:100%;max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden;padding-bottom:68px}.top{direction:ltr;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:rgba(12,16,20,.96);z-index:5;border-bottom:1px solid #171e25}.brand{font-family:cursive;font-size:29px;font-style:italic;font-weight:bold;letter-spacing:-1.5px}.iconbtn{font-size:25px;position:relative;width:38px;height:40px}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);top:5px;right:3px;border:1px solid var(--bg)}.stories{display:flex;gap:15px;overflow-x:auto;padding:14px 13px 13px;border-bottom:1px solid #1a222b;scrollbar-width:none}.story{flex:0 0 70px;text-align:center;font-size:11px;color:#dce1e5;white-space:nowrap}.ring{width:66px;height:66px;padding:3px;border-radius:50%;background:linear-gradient(35deg,#ffb13b,#ff315e,#a33cff);margin:0 auto 6px}.ring.seen{background:#59616a}.avatar{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#27394c,#a44c69);font-size:28px;border:2px solid var(--bg)}.own .ring{background:#505a64}.own .avatar{position:relative}.own .avatar:after{content:'+';position:absolute;bottom:-1px;right:-1px;background:#fff;color:#111;border:2px solid var(--bg);width:20px;height:20px;border-radius:50%;font-size:18px;line-height:17px}.post{border-bottom:1px solid #202832;margin-bottom:10px}.posthead{height:54px;display:flex;align-items:center;gap:10px;padding:0 12px}.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f9a23b,#c33184,#5145bd);font-size:18px}.postname{font-size:13px;font-weight:bold;flex:1}.more{font-size:23px;letter-spacing:2px}.postpic{width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#1b3340,#815b70 50%,#df9860);font-size:90px}.postpic.p2{background:linear-gradient(135deg,#1c1c22,#a13d49,#f3a45c)}.postpic.p3{background:linear-gradient(145deg,#102a3a,#2f6c7d,#c0a078)}.postpic .bigemoji{filter:drop-shadow(0 12px 22px #0008)}.heartpop{position:absolute;font-size:100px;opacity:0;transform:scale(.2);pointer-events:none;text-shadow:0 5px 25px #0008}.heartpop.show{animation:pop .75s ease}@keyframes pop{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.15)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}.actions{display:flex;align-items:center;gap:15px;padding:9px 12px}.actions button{font-size:25px}.actions .save{margin-right:auto}.liked{color:var(--red)!important}.meta{padding:0 13px 13px;font-size:13px;line-height:1.8}.muted{color:var(--muted)}.caption{margin-top:3px}.bottom{direction:ltr;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:66px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;background:var(--bar);border-top:1px solid #222a33;z-index:8}.navbtn{width:46px;height:44px;border-radius:18px;font-size:24px;position:relative}.navbtn.active{background:#29313a}.navbtn.active:after{content:'';position:absolute;bottom:1px;left:19px;width:6px;height:3px;border-radius:5px;background:#fff}.navbtn .dot{right:7px;top:5px}.screen{display:none;min-height:calc(100dvh - 124px)}.screen.active{display:block}.screenhead{padding:16px;font-size:20px;font-weight:bold}.searchbox{margin:12px 14px;background:#202832;border-radius:12px;padding:12px;color:#aeb7c0;display:flex;gap:8px}.searchbox input{background:none;border:0;outline:0;color:#fff;width:100%}.exploregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tile{aspect-ratio:1;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#34475a,#9c536d)}.tile:nth-child(3n+2){background:linear-gradient(145deg,#1b4a50,#c48b58)}.tile:nth-child(3n){background:linear-gradient(135deg,#34243e,#8b5362)}.chatrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #202832}.chatrow .mini{width:48px;height:48px}.chatrow div:nth-child(2){flex:1}.chatrow small{color:var(--muted)}.chatview{display:none;position:absolute;inset:0 0 0;background:var(--bg);z-index:9;padding-bottom:70px}.chatview.open{display:flex;flex-direction:column}.chatbar{height:58px;display:flex;align-items:center;padding:0 14px;gap:12px;border-bottom:1px solid var(--line)}.messages{flex:1;padding:15px;overflow:auto;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;padding:10px 14px;border-radius:18px;background:#222c36;align-self:flex-start}.bubble.mine{background:#285d94;align-self:flex-end}.sendrow{display:flex;padding:10px;gap:8px}.sendrow input{flex:1;background:#202832;border:1px solid #2b3641;border-radius:24px;padding:12px;color:#fff;outline:0}.sendrow button{background:var(--blue);border-radius:50%;width:44px}.reels{height:calc(100dvh - 124px);overflow-y:auto;scroll-snap-type:y mandatory}.reel{height:calc(100dvh - 124px);min-height:520px;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1c3144,#9b4d62,#d7a06a);font-size:100px}.reel:nth-child(2){background:linear-gradient(145deg,#142d36,#416c63,#bb8b59)}.reelinfo{position:absolute;bottom:25px;right:16px;left:78px;font-size:13px;line-height:1.7}.reeltools{position:absolute;left:12px;bottom:30px;display:grid;gap:18px;text-align:center}.reeltools button{font-size:25px}.reeltools small{display:block;font-size:10px}.profiletop{padding:20px 16px}.profileline{display:flex;align-items:center;gap:20px}.profilepic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#f9a23b,#b13e83,#5349bd)}.stats{display:flex;justify-content:space-around;flex:1;text-align:center;font-size:13px}.stats b{display:block;font-size:18px}.profilebuttons{display:flex;gap:8px;margin-top:17px}.profilebuttons button,.follow{background:#28313a;border-radius:8px;padding:9px 12px;flex:1;font-size:12px}.profiletabs{display:flex;border-top:1px solid var(--line);justify-content:space-around;padding:12px}.profiletabs button{font-size:22px}.notice{padding:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px}.notice .follow{flex:0 0 auto;background:#2476bd}.sheetback{display:none;position:fixed;inset:0;background:#0009;z-index:20}.sheetback.open{display:block}.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#171e26;border-radius:20px 20px 0 0;padding:16px;max-height:75dvh;overflow:auto}.handle{width:40px;height:4px;border-radius:5px;background:#59616a;margin:0 auto 15px}.comment{padding:10px 0;font-size:13px}.comment b{margin-left:7px}.commentform{display:flex;gap:8px;margin-top:12px}.commentform input{flex:1;background:#252e38;border:0;border-radius:22px;padding:12px;color:#fff;outline:0}.commentform button{color:var(--blue)}.storyview,.camera{display:none;position:fixed;inset:0;background:#080b10;z-index:30;max-width:480px;margin:auto}.storyview.open,.camera.open{display:block}.storyprogress{display:flex;gap:4px;padding:12px 8px}.storyprogress span{height:3px;border-radius:3px;background:#ffffff55;flex:1;overflow:hidden}.storyprogress i{display:block;height:100%;background:white;width:0}.storyhead{display:flex;align-items:center;gap:9px;padding:3px 13px}.storybody{height:75dvh;display:grid;place-items:center;font-size:110px;background:linear-gradient(145deg,#26394c,#a14e72,#d4a46c);margin-top:12px}.storytap{position:absolute;inset:65px 0 80px;display:flex}.storytap button{flex:1}.storyreply{position:absolute;bottom:20px;left:12px;right:12px;display:flex;gap:10px}.storyreply input{flex:1;border:1px solid #aaa;background:#1119;border-radius:25px;padding:12px;color:white}.camera{background:#050608}.camtop{display:flex;justify-content:space-between;padding:22px;font-size:25px}.viewfinder{height:62dvh;margin:5px 12px;background:radial-gradient(circle at 50% 40%,#5d6871,#202a34 55%,#090c10);border-radius:12px;display:grid;place-items:center;font-size:85px}.shutter{width:72px;height:72px;border:5px solid white;border-radius:50%;margin:18px auto;background:#ffffff33}.camtabs{display:flex;justify-content:center;gap:24px;color:#aab3bb;font-size:13px}.camtabs .sel{color:#ffcf64;font-weight:bold}.createmenu{display:none;position:fixed;inset:0;background:#0009;z-index:25;align-items:flex-end}.createmenu.open{display:flex}.createmenu .sheet{position:relative}.menuitem{padding:15px;border-bottom:1px solid var(--line);font-size:16px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#29333e;padding:11px 18px;border-radius:24px;z-index:50;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.settings{display:none;position:absolute;inset:0;background:var(--bg);z-index:12;padding:20px}.settings.open{display:block}.settings button{display:block;padding:15px;border-bottom:1px solid var(--line);width:100%;text-align:right}
</style></head>
<body><div class="app" id="app">
<header class="top"><button class="iconbtn" onclick="showScreen('activity')" aria-label="اعلان‌ها">♡<i class="dot"></i></button><div class="brand">Instagram</div><button class="iconbtn" onclick="openCreate()">＋</button></header>
<section class="screen active" id="home"><div class="stories" id="stories">
<div class="story own" onclick="openCamera('داستان')"><div class="ring"><div class="avatar">🙂</div></div>داستان شما</div>
<div class="story" onclick="openStory('parsardasht','🌄')"><div class="ring"><div class="avatar">🏞️</div></div>parsardasht</div><div class="story" onclick="openStory('ufc','🥊')"><div class="ring"><div class="avatar" style="background:#050505;color:#fff;font-weight:900;font-style:italic">UFC</div></div>ufc</div><div class="story" onclick="openStory('charlesdobronxs','🥋')"><div class="ring"><div class="avatar">🥋</div></div>charlesdobronxs</div></div><div id="feed"></div></section>
<section class="screen" id="search"><div class="searchbox">⌕ <input placeholder="جستجو" oninput="filterGrid(this.value)"></div><div class="exploregrid" id="explore"></div></section>
<section class="screen" id="messages"><div class="screenhead">پیام‌ها</div><div id="chatlist"></div></section>
<section class="screen" id="reels"><div class="reels" id="reelbox"></div></section>
<section class="screen" id="activity"><div class="screenhead">اعلان‌ها</div><div id="activitylist"></div></section>
<section class="screen" id="profile"><div class="profiletop"><div class="profileline"><div class="profilepic">🙂</div><div class="stats"><span><b id="postcount">3</b>پست</span><span><b>1,248</b>دنبال‌کننده</span><span><b>382</b>دنبال‌شونده</span></div></div><h3 id="profilename">کاربر NOVYRA</h3><small class="muted">به دنیای من خوش آمدید ✨</small><div class="profilebuttons"><button>ویرایش نمایه</button><button>اشتراک‌گذاری نمایه</button><button onclick="toggleSettings()">☰</button></div></div><div class="profiletabs"><button>▦</button><button onclick="showScreen('reels')">▣</button><button>♙</button></div><div class="exploregrid" id="profilegrid"></div></section>
<nav class="bottom"><button class="navbtn" onclick="showScreen('profile')">🙂</button><button class="navbtn" onclick="showScreen('search')">⌕</button><button class="navbtn" onclick="showScreen('messages')">➤<i class="dot"></i></button><button class="navbtn" onclick="showScreen('reels')">▣</button><button class="navbtn active" onclick="showScreen('home')">⌂</button></nav>
<div class="chatview" id="chatview"><div class="chatbar"><button onclick="closeChat()">‹</button><div class="mini">🌙</div><b id="chatname">گفتگو</b></div><div class="messages" id="chatmessages"></div><div class="sendrow"><input id="chatinput" placeholder="پیام بنویس..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">➤</button></div></div>
<div class="settings" id="settings"><button onclick="toggleSettings()">← بستن</button><h2>تنظیمات و حریم خصوصی</h2><button>فعالیت شما</button><button>ذخیره‌شده</button><button>بایگانی</button><button>نزدیک‌ترین دوستان</button><button onclick="toast('حالت تاریک فعال است')">حالت تاریک ✓</button><button onclick="localStorage.removeItem('projectx-token');localStorage.removeItem('projectx-account');location.href='/'">خروج از حساب</button></div>
</div>
<div class="sheetback" id="sheetback" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><h3>دیدگاه‌ها</h3><div id="comments"></div><div class="commentform"><input id="commentinput" placeholder="نظر خود را بنویس..." onkeydown="if(event.key==='Enter')addComment()"><button onclick="addComment()">ارسال</button></div></div></div>
<div class="storyview" id="storyview"><div class="storyprogress"><span><i id="storybar"></i></span></div><div class="storyhead"><div class="mini" id="storyavatar">🌄</div><b id="storyuser">parsardasht</b><button style="margin-right:auto;font-size:26px" onclick="closeStory()">×</button></div><div class="storybody" id="storyemoji">🌄</div><div class="storytap"><button onclick="prevStory()"></button><button onclick="nextStory()"></button></div><div class="storyreply"><input placeholder="پاسخ به داستان..."><button onclick="toast('پاسخ ارسال شد')">ارسال</button><button onclick="toast('❤️')">♡</button></div></div>
<div class="camera" id="camera"><div class="camtop"><button onclick="toast('فلش روشن/خاموش')">⚡</button><button onclick="closeCamera()">×</button><button onclick="toast('دوربین چرخانده شد')">↻</button></div><div class="viewfinder" id="viewfinder">📷</div><div class="shutter" onclick="capture()"></div><div class="camtabs"><span onclick="setCamTab(this)">پست</span><span onclick="setCamTab(this)">داستان</span><span class="sel" onclick="setCamTab(this)">ریل</span><span onclick="setCamTab(this)">زنده</span></div></div>
<div class="createmenu" id="createmenu" onclick="if(event.target===this)closeCreate()"><div class="sheet"><div class="handle"></div><h3>ساخت محتوای جدید</h3><div class="menuitem" onclick="openCamera('پست')">▧　 پست</div><div class="menuitem" onclick="openCamera('ریل')">▣　 ریل</div><div class="menuitem" onclick="openCamera('داستان')">◉　 داستان</div><div class="menuitem" onclick="openCamera('زنده')">●　 زنده</div></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let posts=[{user:'parsardasht',emoji:'🏔️',caption:'طبیعت همیشه حرفی برای گفتن دارد. 🌿',likes:248,comments:['چه منظره زیبایی!','عالیه ❤️'],style:''},{user:'ufc',emoji:'🥊',caption:'لحظه‌های فراموش‌نشدنی از دنیای مبارزه.',likes:1820,comments:['چه مبارزه‌ای!','🔥🔥'],style:'p2'},{user:'charlesdobronxs',emoji:'🥋',caption:'تمرکز، تلاش و ادامه دادن.',likes:921,comments:['قهرمان!'],style:'p3'}];let activePost=0,storyIndex=0,storyTimer=null,storyStart=null,currentChat='';const storyData=[['parsardasht','🌄'],['ufc','🥊'],['charlesdobronxs','🥋']];
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function renderFeed(){ $('feed').innerHTML=posts.map((p,i)=>'<article class="post"><div class="posthead"><div class="mini">'+p.emoji+'</div><b class="postname">'+p.user+'</b><button class="more">•••</button></div><div class="postpic '+p.style+'" ondblclick="doubleLike('+i+')"><span class="bigemoji">'+p.emoji+'</span><span class="heartpop" id="heart'+i+'">❤️</span></div><div class="actions"><button id="like'+i+'" onclick="likePost('+i+')">♡</button><button onclick="openComments('+i+')">▢</button><button onclick="toast('+"'لینک پست کپی شد'"+')">➤</button><button class="save" id="save'+i+'" onclick="savePost('+i+')">♧</button></div><div class="meta"><b>'+p.likes.toLocaleString('fa-IR')+' پسند</b><div class="caption"><b>'+p.user+'</b> '+p.caption+'</div><div class="muted" onclick="openComments('+i+')">مشاهده '+p.comments.length+' نظر</div></div></article>').join('');$('postcount').textContent=posts.length}
function likePost(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;$('like'+i).classList.toggle('liked',posts[i].liked);$('like'+i).textContent=posts[i].liked?'♥':'♡';renderLikeCount(i)}
function renderLikeCount(i){let b=document.querySelectorAll('.post .meta b')[i];if(b)b.textContent=posts[i].likes.toLocaleString('fa-IR')+' پسند'}
function doubleLike(i){if(!posts[i].liked){posts[i].liked=true;posts[i].likes++;$('like'+i).classList.add('liked');$('like'+i).textContent='♥';renderLikeCount(i)}let h=$('heart'+i);h.classList.remove('show');void h.offsetWidth;h.classList.add('show')}
function savePost(i){posts[i].saved=!posts[i].saved;$('save'+i).textContent=posts[i].saved?'▣':'♧';toast(posts[i].saved?'به ذخیره‌شده‌ها اضافه شد':'از ذخیره‌شده‌ها حذف شد')}
function openComments(i){activePost=i;$('comments').innerHTML=posts[i].comments.map(c=>'<div class="comment"><b>کاربر</b>'+c+'</div>').join('')||'<p class="muted">هنوز نظری ثبت نشده است.</p>';$('sheetback').classList.add('open')}
function closeSheet(){$('sheetback').classList.remove('open')}
function addComment(){let v=$('commentinput').value.trim();if(!v)return;posts[activePost].comments.push(v);$('commentinput').value='';openComments(activePost);renderFeed()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.navbtn').forEach((b,i)=>b.classList.toggle('active',['profile','search','messages','reels','home'][i]===id));if(id==='activity')renderActivity()}
function openStory(user,emoji){storyIndex=Math.max(0,storyData.findIndex(x=>x[0]===user));$('storyview').classList.add('open');drawStory();startStory()}
function drawStory(){let [u,e]=storyData[storyIndex];$('storyuser').textContent=u;$('storyavatar').textContent=e;$('storyemoji').textContent=e;$('storybar').style.width='0%'}
function startStory(){clearInterval(storyTimer);storyStart=Date.now();storyTimer=setInterval(()=>{let n=Math.min(100,(Date.now()-storyStart)/50);$('storybar').style.width=n+'%';if(n>=100)nextStory()},50)}
function nextStory(){if(storyIndex<storyData.length-1){storyIndex++;drawStory();startStory()}else closeStory()}
function prevStory(){storyIndex=Math.max(0,storyIndex-1);drawStory();startStory()}
function closeStory(){clearInterval(storyTimer);$('storyview').classList.remove('open')}
function openCreate(){$('createmenu').classList.add('open')}function closeCreate(){$('createmenu').classList.remove('open')}
let camType='پست';function openCamera(type){camType=type;closeCreate();$('camera').classList.add('open');document.querySelectorAll('.camtabs span').forEach(s=>s.classList.toggle('sel',s.textContent===type))}
function closeCamera(){$('camera').classList.remove('open')}function setCamTab(el){camType=el.textContent;document.querySelectorAll('.camtabs span').forEach(s=>s.classList.toggle('sel',s===el))}
function capture(){let p={user:'شما',emoji:camType==='داستان'?'🌅':camType==='ریل'?'🎬':'📸',caption:'لحظه‌ای تازه از من ✨',likes:0,comments:[],style:'p3'};if(camType==='داستان'){storyData.unshift(['شما','🌅']);$('stories').insertAdjacentHTML('beforeend','<div class="story" onclick="openStory(\'شما\',\'🌅\')"><div class="ring"><div class="avatar">🌅</div></div>داستان شما</div>');toast('داستان شما منتشر شد')}else{posts.unshift(p);renderFeed();toast('محتوای جدید به صفحه خانه اضافه شد')}closeCamera();showScreen('home')}
function filterGrid(v){document.querySelectorAll('#explore .tile').forEach((t,i)=>t.style.display=(!v||t.dataset.key.includes(v.toLowerCase()))?'grid':'none')}
function renderExplore(){let em=['🌅','🏙️','🐈','⚽','🌊','🥊','🎨','🏔️','🍜','🎧','🚗','🌸'];$('explore').innerHTML=em.map((e,i)=>'<div class="tile" data-key="'+e+' '+['طبیعت','شهر','گربه','ورزش','دریا','ufc','هنر','کوه','غذا','موسیقی','ماشین','گل'][i]+'" onclick="openPostFromGrid('+i+')">'+e+'</div>').join('');$('profilegrid').innerHTML=em.slice(0,9).map(e=>'<div class="tile">'+e+'</div>').join('')}
function openPostFromGrid(i){let idx=i%posts.length;showScreen('home');setTimeout(()=>document.querySelectorAll('.post')[idx]?.scrollIntoView({behavior:'smooth'}),50)}
function renderChats(){let names=['دوست من','علی','سارا','UFC Fans'];$('chatlist').innerHTML=names.map((n,i)=>'<div class="chatrow" onclick="openChat(\''+n+'\')"><div class="mini">'+['🌙','🧑','👩','🥊'][i]+'</div><div><b>'+n+'</b><br><small>برای شروع گفتگو لمس کنید</small></div><span class="muted">●</span></div>').join('')}
function openChat(n){currentChat=n;$('chatname').textContent=n;$('chatmessages').innerHTML='<div class="bubble">سلام! 👋</div>';$('chatview').classList.add('open')}
function closeChat(){$('chatview').classList.remove('open')}
function sendMessage(){let v=$('chatinput').value.trim();if(!v)return;$('chatmessages').insertAdjacentHTML('beforeend','<div class="bubble mine">'+v.replace(/[<>]/g,'')+'</div>');$('chatinput').value='';$('chatmessages').scrollTop=$('chatmessages').scrollHeight}

renderFeed();renderExplore();renderChats();$('profilename').textContent=(JSON.parse(localStorage.getItem('projectx-account')||'{}').name)||'کاربر NOVYRA';
