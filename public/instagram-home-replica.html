<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1218">
<title>Instagram Android Home — NOVYRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1218;--nav:#12161C;--black:#000;--white:#fff;--muted:#A8A8A8;--ring:#2B2F36;--burgundy:#5A0A2A;--red:#D7131B;--orange:#F7761B;--yellow:#FDC51B;--gray:#333;--light:#EDEDED}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--white)}
body{font-family:Roboto,Vazirmatn,sans-serif}
.phone{width:100vw;height:100dvh;max-height:100dvh;aspect-ratio:1080/2340;margin:auto;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (min-aspect-ratio:1080/2340){.phone{width:min(100vw,46.1538vh);height:min(100dvh,216.6667vw)}}
svg{display:block}
.status{height:4%;flex:0 0 4%;display:flex;align-items:center;justify-content:space-between;padding:0 3.5%;direction:ltr;font:600 2.8vw Roboto,sans-serif}
.status-left,.status-right{display:flex;align-items:center;gap:1.4vw}
.battery{width:5.2vw;height:2.5vw;border:.35vw solid white;border-radius:.6vw;position:relative;display:flex;align-items:center;justify-content:center;font-size:1.8vw;line-height:1}
.battery:after{content:"";position:absolute;right:-.9vw;width:.5vw;height:1vw;background:white;border-radius:0 .3vw .3vw 0}
.signal{display:flex;align-items:end;gap:.35vw;height:2.6vw}.signal i{display:block;width:.65vw;background:white;border-radius:.2vw}.signal i:nth-child(1){height:35%}.signal i:nth-child(2){height:55%}.signal i:nth-child(3){height:75%}.signal i:nth-child(4){height:100%;opacity:.35}
.vpn{border:.25vw solid white;border-radius:.5vw;padding:.1vw .7vw;font-size:2vw}
.status-right{gap:2vw}.status-right .time{font:600 3vw Vazirmatn,sans-serif;direction:rtl;margin-left:.5vw}.status-glyph{width:3vw;height:3vw}
.header{height:5%;flex:0 0 5%;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 4%;direction:ltr}
.header-side{display:flex;align-items:center}.header-side.right{justify-content:flex-end}.header-side.left{justify-content:flex-start}.header-icon{width:7vw;height:7vw}
.wordmark{display:flex;align-items:center;justify-content:center;gap:1.5vw;font-family:cursive;font-size:7vw;font-weight:700;letter-spacing:-.4vw;white-space:nowrap}.chevron{width:2.3vw;height:2.3vw}
.stories{height:15.8%;flex:0 0 15.8%;display:flex;align-items:flex-start;overflow:hidden;direction:ltr;padding-top:2.4%}
.story-track{display:flex;align-items:flex-start;gap:2.3vw;width:max-content;transform:translateX(-6vw)}
.story{width:20vw;flex:0 0 20vw;display:flex;flex-direction:column;align-items:center;gap:1.2vw}
.story-ring{width:20vw;height:20vw;border-radius:50%;border:.45vw solid var(--ring);padding:.7vw;position:relative}
.story-ring.dashed{border:.55vw dashed #8A8D94;padding:.6vw}
.story-img{width:100%;height:100%;border-radius:50%;background:var(--gray);display:block;object-fit:cover}
.story-label{font:400 3vw/1.3 Roboto,Vazirmatn,sans-serif;color:var(--muted);text-align:center;white-space:nowrap;direction:ltr}
.story-label.fa{direction:rtl;font-family:Vazirmatn,sans-serif}
.add-story{position:absolute;width:6vw;height:6vw;right:-.4vw;bottom:-.3vw;background:white;color:#111;border:.4vw solid var(--bg);border-radius:50%;display:grid;place-items:center;font:400 5vw/1 Arial,sans-serif}
.post{height:64.2%;flex:0 0 64.2%;background:var(--burgundy);position:relative;overflow:hidden}
.post-header{height:11%;position:absolute;z-index:3;top:0;left:0;right:0;display:grid;grid-template-columns:12% 1fr 15%;align-items:center;padding:0 3%;direction:ltr}
.more{width:6vw;height:6vw}.post-title{font:800 3.5vw/1.25 Roboto,Vazirmatn,sans-serif;text-align:center;white-space:nowrap;direction:rtl}.post-sub{font:400 2.6vw/1.4 Roboto,Vazirmatn,sans-serif;text-align:center;color:#fff;white-space:nowrap;direction:rtl;margin-top:.5vw}
.post-avatars{display:flex;align-items:center;justify-content:flex-end}.post-avatars span{width:7vw;height:7vw;border:.4vw solid var(--burgundy);border-radius:50%;background:linear-gradient(135deg,#1c9caa,#e7bc54,#e64e60)}.post-avatars span+span{margin-left:-2.5vw;background:linear-gradient(135deg,#4d7fba,#f1c56d,#8c4d9b)}
.poster{position:absolute;top:10%;left:4%;width:92%;height:105%;border-radius:3.7vw 3.7vw 0 0;overflow:hidden;background:linear-gradient(160deg,var(--red) 0%,var(--orange) 48%,var(--yellow) 100%);box-shadow:0 1.5vw 4vw #21000c88}
.poster:before{content:"";position:absolute;left:0;top:0;width:42%;height:29%;opacity:.18;background-image:radial-gradient(#7b1010 1px,transparent 1.4px);background-size:1.2vw 1.2vw}
.poster-content{position:relative;height:100%;padding:4% 5%;display:flex;flex-direction:column;align-items:center;gap:1.1vw}
.virus-area{height:20%;width:100%;position:relative;display:flex;justify-content:flex-end;align-items:flex-start;padding-right:3%}
.virus{width:24vw;height:24vw;filter:drop-shadow(0 1vw 1vw #6d1b1766)}.virus.small{width:9vw;height:9vw;position:absolute;right:1%;top:52%}.virus.tiny{width:6vw;height:6vw;position:absolute;right:25%;top:12%}
.school-scene{width:100%;height:20%;display:flex;align-items:center;justify-content:center;position:relative;margin-top:-3%}
.school{position:absolute;width:57%;height:77%;right:9%;top:4%;border:.8vw solid #e5c8a2;border-radius:1vw;background:linear-gradient(#d5c1a5 0 23%,#b78d6b 23% 100%);box-shadow:0 1vw 2vw #6c1a0c55;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
.school:before{content:"";position:absolute;inset:32% 0 0;background:repeating-linear-gradient(90deg,transparent 0 8%,#5c6d7c 8% 10%,transparent 10% 18%)}
.school-sign{z-index:1;background:#125da5;color:#fff;font:800 4vw Vazirmatn,sans-serif;padding:.4vw 4vw;border-radius:.4vw}
.school-ground{position:absolute;bottom:0;width:100%;height:13%;background:#596b43}
.no-school{position:absolute;left:4%;top:0;width:35vw;height:35vw;border:2.2vw solid #d71920;border-radius:50%;display:grid;place-items:center;background:#ffffff22;z-index:2}
.no-school:after{content:"";position:absolute;width:120%;height:2.2vw;background:#d71920;transform:rotate(-45deg);border-radius:2vw}
.bag{position:relative;width:13vw;height:15vw;background:#1768bd;border-radius:3vw 3vw 2vw 2vw;box-shadow:inset -2vw 0 #0d4389;z-index:1}
.bag:before{content:"";position:absolute;width:6vw;height:3vw;border:1.4vw solid #174c89;border-bottom:0;border-radius:4vw 4vw 0 0;top:-3vw;left:3vw}
.bag:after{content:"";position:absolute;left:2vw;right:2vw;bottom:3vw;height:4vw;border-radius:1vw;background:#4e9be6}
.warning{position:absolute;right:1%;bottom:-5%;width:13vw;height:13vw;z-index:3}
.banner{position:relative;z-index:4;min-height:9%;width:94%;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:2.5vw;transform:skewY(-3deg);box-shadow:0 1.5vw 2vw #63100077,inset 0 .8vw 0 #ffffff35,inset 0 -1vw 0 #00000018;padding:1.2% 2%;white-space:nowrap}
.banner span{transform:skewY(3deg);display:block}
.banner.red{background:linear-gradient(180deg,#fa3b31,var(--red) 52%,#a90d17);color:#fff;font:900 10vw/1.1 Vazirmatn,sans-serif}
.banner.gray{width:79%;min-height:7%;background:linear-gradient(#fff,#dedede);color:#171717;font:900 8vw/1.1 Vazirmatn,sans-serif}
.banner.white{width:86%;min-height:9%;background:linear-gradient(#fff,#eee);color:var(--red);font:900 13vw/1.1 Vazirmatn,sans-serif}
.banner.yellow{width:96%;min-height:7%;background:linear-gradient(#ffe76b,var(--yellow));color:#171717;font:900 5vw/1.2 Vazirmatn,sans-serif}
.banner.last{min-height:10%;font-size:11vw}
.bottom{height:5%;flex:0 0 5%;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;direction:ltr;padding:0 2%}
.nav-item{height:100%;display:flex;align-items:center;justify-content:center}.nav-icon{width:7vw;height:7vw}.active-pill{width:13vw;height:9vw;border-radius:3vw;background:#2A2D33;display:grid;place-items:center}.profile{width:7vw;height:7vw;border-radius:50%;background:#555;border:.35vw solid white}
.android-nav{height:6%;flex:0 0 6%;background:#000;display:flex;align-items:center;justify-content:space-around;color:#CFCFCF}
.android-nav svg{width:5vw;height:5vw}
@media (min-width:700px){.phone{width:min(100vw,46.1538vh)}}
</style>
</head>
<body>
