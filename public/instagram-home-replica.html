<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1218">
<title>Instagram Android Home Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1218;--nav:#12161C;--black:#000;--white:#fff;--muted:#A8A8A8;--ring:#2B2F36;--burgundy:#5A0A2A;--red:#D7131B;--orange:#F7761B;--yellow:#FDC51B;--gray:#333;--light:#EDEDED}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--white)}
body{font-family:Roboto,Vazirmatn,sans-serif}
.phone{width:100vw;height:100dvh;max-height:100dvh;aspect-ratio:9/19.5;margin:auto;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (min-aspect-ratio:9/19.5){.phone{width:min(100vw,51.282vh);height:min(100dvh,195vw)}}
svg{display:block}
.status{height:4%;flex:0 0 4%;display:flex;align-items:center;justify-content:space-between;padding:0 3.5%;direction:ltr;font:600 2.8vw Roboto,sans-serif}
.status-left,.status-right{display:flex;align-items:center;gap:1.4vw}
.battery{width:5.2vw;height:2.5vw;border:.35vw solid white;border-radius:.6vw;position:relative;display:flex;align-items:center;justify-content:center;font-size:1.8vw;line-height:1}
.battery:after{content:"";position:absolute;right:-.9vw;width:.5vw;height:1vw;background:white;border-radius:0 .3vw .3vw 0}
.signal{display:flex;align-items:end;gap:.35vw;height:2.6vw}.signal i{display:block;width:.65vw;background:white;border-radius:.2vw}.signal i:nth-child(1){height:35%}.signal i:nth-child(2){height:55%}.signal i:nth-child(3){height:75%}.signal i:nth-child(4){height:100%;opacity:.35}
.vpn{border:.25vw solid white;border-radius:.5vw;padding:.1vw .7vw;font-size:2vw}
.status-right{gap:2vw}.status-right .time{font:600 3vw Vazirmatn,sans-serif;direction:rtl;margin-left:.5vw}.status-glyph{width:3vw;height:3vw}
.header{height:5%;flex:0 0 5%;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 4%;direction:ltr}
.header-side{display:flex;align-items:center}.header-side.right{justify-content:flex-end}.header-side.left{justify-content:flex-start}.header-icon{width:7vw;height:7vw}
.wordmark{display:flex;align-items:center;justify-content:center;gap:1.5vw;font-family:cursive;font-size:7vw;font-weight:700;letter-spacing:-.4vw;white-space:nowrap}.chevron{width:2.3vw;height:2.3vw}
.stories{height:15.8%;flex:0 0 15.8%;display:flex;align-items:flex-start;overflow:hidden;direction:ltr;padding-top:2.4%}
.story-track{display:flex;align-items:flex-start;gap:2.3vw;width:max-content;transform:translateX(-6vw)}
.story{width:20vw;flex:0 0 20vw;display:flex;flex-direction:column;align-items:center;gap:1.2vw}
.story-ring{width:20vw;height:20vw;border-radius:50%;border:.45vw solid var(--ring);padding:.7vw;position:relative}
.story-ring.dashed{border:.55vw dashed #8A8D94;padding:.6vw}
.story-img{width:100%;height:100%;border-radius:50%;background:var(--gray);display:block;object-fit:cover}
.story-label{font:400 3vw/1.3 Roboto,Vazirmatn,sans-serif;color:var(--muted);text-align:center;white-space:nowrap;direction:ltr}
.story-label.fa{direction:rtl;font-family:Vazirmatn,sans-serif}
.add-story{position:absolute;width:6vw;height:6vw;right:-.4vw;bottom:-.3vw;background:white;color:#111;border:.4vw solid var(--bg);border-radius:50%;display:grid;place-items:center;font:400 5vw/1 Arial,sans-serif}
.post{height:64.2%;flex:0 0 64.2%;background:var(--burgundy);position:relative;overflow:hidden}
.post-header{height:11%;position:absolute;z-index:3;top:0;left:0;right:0;display:grid;grid-template-columns:12% 1fr 15%;align-items:center;padding:0 3%;direction:ltr}
.menu-lines{width:6vw;display:flex;flex-direction:column;gap:1.2vw}.menu-lines span{display:block;height:.55vw;background:white;border-radius:1vw}.menu-lines span:first-child{width:5.5vw}.menu-lines span:last-child{width:4.2vw}
.post-account{text-align:center;direction:rtl;font-family:Roboto,Vazirmatn,sans-serif;min-width:0}.account-name{font-size:3.4vw;font-weight:800;white-space:nowrap}
.audio-name{margin-top:.7vw;font-size:2.6vw;display:flex;justify-content:center;align-items:center;gap:.8vw;white-space:nowrap}.audio-name svg{width:2.6vw;height:2.6vw}
.post-avatars{position:relative;width:11vw;height:8vw;justify-self:end}.post-avatars i{position:absolute;top:0;width:7.5vw;height:7.5vw;border-radius:50%;border:.5vw solid var(--burgundy);background:radial-gradient(circle at 35% 35%,#f6d46c 0 12%,#288c9a 13% 35%,#18496a 36% 60%,#e4b34b 61%);}.post-avatars i:first-child{right:0;z-index:2}.post-avatars i:last-child{right:4vw;top:1vw;background:radial-gradient(circle,#e5b63e 0 20%,#d74d38 21% 40%,#286a83 41% 70%)}
.poster{position:absolute;top:10%;left:4%;width:92%;height:94%;border-radius:3.7vw;overflow:hidden;background:radial-gradient(circle at 100% 100%,rgba(255,221,45,.85),transparent 35%),linear-gradient(160deg,var(--red) 0%,#E72A16 28%,var(--orange) 62%,#F9A51B 83%,var(--yellow) 100%);box-shadow:0 1vw 3vw #0004;direction:rtl}
.poster:before{content:"";position:absolute;left:-2%;top:-1%;width:40%;height:25%;opacity:.16;background-image:radial-gradient(#5C1010 18%,transparent 20%);background-size:2.2vw 2.2vw;mask-image:linear-gradient(135deg,#000,transparent 90%)}
.virus{position:absolute;top:2%;right:6%;width:23%;height:14%}.virus.small{width:10%;height:7%;top:11%;right:29%}.virus.tiny{width:7%;height:5%;top:3%;right:34%}
.school-scene{position:absolute;top:14%;left:5%;width:90%;height:23%;display:flex;align-items:center;justify-content:center}
.school-building{position:absolute;left:18%;top:9%;width:65%;height:79%;background:linear-gradient(#E6D1A7,#B98C68);border:.8vw solid #F4E3C7;border-radius:1.4vw;box-shadow:0 1vw 1.5vw #0004;overflow:hidden}
.school-building:before{content:"";position:absolute;top:12%;left:10%;right:10%;height:23%;background:#1F5C9A;border-radius:.5vw}
.school-sign{position:absolute;top:14%;left:10%;width:80%;text-align:center;color:white;font:900 4vw Vazirmatn,sans-serif;z-index:2}
.school-windows{position:absolute;left:12%;right:12%;bottom:12%;height:35%;display:flex;justify-content:space-around}.school-windows i{width:16%;height:100%;background:#42749A;border:.5vw solid #F1D8B3}.school-door{position:absolute;bottom:0;left:43%;width:15%;height:32%;background:#75523C}
.no-symbol{position:absolute;left:0;top:4%;width:43%;height:94%;border:2.4vw solid #D20C19;border-radius:50%;background:#ffffff1a;z-index:3;display:grid;place-items:center}.no-symbol:after{content:"";position:absolute;width:120%;height:2.3vw;background:#D20C19;transform:rotate(-45deg);border:.4vw solid white;border-radius:2vw}
.school-bag{font-size:10vw;filter:drop-shadow(.6vw .6vw .5vw #0005)}
.warning{position:absolute;right:0;top:16%;width:20%;height:48%;z-index:4}
.poster-copy{position:absolute;top:38%;left:4%;width:92%;display:flex;flex-direction:column;align-items:center;gap:1.2vw}
.banner{width:96%;min-height:10vw;padding:1.3vw 1vw;display:flex;justify-content:center;align-items:center;text-align:center;transform:skewY(-3deg);border-radius:2vw;box-shadow:0 1.3vw 1.2vw #0005,inset 0 .7vw 1vw #ffffff47;line-height:1.2;white-space:nowrap;font-family:Vazirmatn,sans-serif}
.banner span{transform:skewY(3deg);display:block}
.banner-red{color:white;background:linear-gradient(180deg,#F72B2C,#B90010);font-size:10vw;font-weight:900;min-height:14vw;text-shadow:0 .5vw .3vw #0004}
.banner-gray{width:82%;color:#171717;background:linear-gradient(180deg,#fff,#D5D5D5);font-size:8vw;font-weight:900;min-height:11vw}
.banner-white{width:94%;color:var(--red);background:linear-gradient(180deg,#fff,#E8E8E8);font-size:13vw;font-weight:900;min-height:16vw;box-shadow:0 1.3vw 1.3vw #0005,inset 0 .8vw 1vw white}
.banner-yellow{width:100%;color:#171717;background:linear-gradient(180deg,#FFE85B,#F4B900);font-size:5vw;font-weight:900;min-height:10vw}
.banner-last{width:92%;min-height:16vw;font-size:11vw}
.bottom-nav{height:5%;flex:0 0 5%;background:var(--nav);display:flex;align-items:center;justify-content:space-around;direction:ltr;padding:0 2%}
.nav-item{width:17%;height:100%;display:flex;align-items:center;justify-content:center}.nav-icon{width:7.2vw;height:7.2vw}
.active-pill{width:12vw;height:9vw;border-radius:4vw;background:#2A2D33;display:grid;place-items:center}.active-pill svg{width:7vw;height:7vw}
.profile-nav{width:7.5vw;height:7.5vw;border-radius:50%;background:linear-gradient(145deg,#ddd,#333 45%,#111);border:.4vw solid white;overflow:hidden}
.android-nav{height:6%;flex:0 0 6%;background:#000;display:flex;align-items:center;justify-content:space-around;direction:ltr}.android-nav svg{width:5vw;height:5vw}
</style>
</head>
<body>
<main class="phone">
<section class="status">
 <div class="status-left"><div class="battery">23</div><span>4G</span><div class="signal"><i></i><i></i><i></i><i></i></div><span class="vpn">VPN</span></div>
 <div class="status-right"><span style="font-size:4vw;letter-spacing:.2vw">···</span>
  <svg class="status-glyph" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="white"/></svg>

  <svg class="status-glyph" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="white"/></svg><span class="time">۲۱:۴۶</span>

<header class="header">

 <div class="wordmark"><svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2"><path d="m2 4 4 4 4-4"/></svg><span>Instagram</span></div>
 <div class="header-side right"><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
</header>
<section class="stories"><div class="story-track">

 <div class="story"><div class="story-ring dashed"><div class="story-img"></div></div><div class="story-label">l_the_kami_l</div></div>
 <div class="story"><div class="story-ring"><div class="story-img" style="background:linear-gradient(135deg,#222,#777,#171717)"></div><div class="add-story">+</div></div><div class="story-label fa">داستان شما</div></div>
</div></section>
<section class="post">
 <header class="post-header"><div class="menu-lines"><span></span><span></span></div>
  <div class="post-account"><div class="account-name">akhbarsardasht و digikala_rayegan</div><div class="audio-name"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>digikala_rayegan · صدای اصلی</span></div></div>
  <div class="post-avatars"><i></i><i></i></div>
 </header>
 <div class="poster">
  <svg class="virus" viewBox="0 0 100 100"><g stroke="#174B9B" stroke-width="5" fill="#2878D1"><path d="M50 2v15M50 83v15M2 50h15M83 50h15M16 16l11 11M73 73l11 11M84 16 73 27M27 73 16 84"/><circle cx="50" cy="50" r="31"/><circle cx="39" cy="39" r="5" fill="#8EC8F7" stroke="none"/><circle cx="62" cy="47" r="4" fill="#8EC8F7" stroke="none"/><circle cx="47" cy="65" r="4" fill="#8EC8F7" stroke="none"/></g></svg>
  <svg class="virus small" viewBox="0 0 100 100"><g stroke="#174B9B" stroke-width="7" fill="#2878D1"><path d="M50 0v20M50 80v20M0 50h20M80 50h20M15 15l15 15M70 70l15 15M85 15 70 30M30 70 15 85"/><circle cx="50" cy="50" r="30"/></g></svg>

  <div class="school-scene"><div class="school-building"><div class="school-sign">مدرسه</div><div class="school-windows"><i></i><i></i><i></i><i></i></div><div class="school-door"></div></div><div class="no-symbol"><span class="school-bag">🎒</span></div>
   <svg class="warning" viewBox="0 0 100 100"><path d="M50 5 96 88H4Z" fill="#fff" stroke="#D5D5D5" stroke-width="4" stroke-linejoin="round"/><path d="M50 30v30" stroke="#171717" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="74" r="5" fill="#171717"/></svg>
  </div>
  <div class="poster-copy"><div class="banner banner-red"><span>تعطیلی مدارس</span></div><div class="banner banner-gray"><span>مدارس ابتدایی</span></div><div class="banner banner-white"><span>بوکان فردا</span></div><div class="banner banner-yellow"><span>به دلیل شیوع ویروس آنفولانزا</span></div><div class="banner banner-red banner-last"><span>تعطیل شد</span></div></div>

<nav class="bottom-nav">
 <div class="nav-item"><div class="profile-nav"></div></div>
 <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.1" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></svg></div>
 <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></div>
 <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="17" rx="5"/><path d="m10 8 6 4-6 4Z" fill="white" stroke="none"/></svg></div>

</main>
