name = "novyra-preview-api"
main = "index.js"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]
account_id = "595c5761b6974e9f7ed15db0e5ffe3b8"
previews = {}

[vars]
APP_URL = "https://feature-homa-auth-part1.novyra.pages.dev"
WEBAUTHN_ORIGIN = "https://feature-homa-auth-part1.novyra.pages.dev"
REQUIRE_EMAIL_VERIFICATION = "false"
EMAIL_FROM = "__PREVIEW_EMAIL_FROM__"
GOOGLE_REDIRECT_URI = "https://novyra-preview-api.projectx-novyratam.workers.dev/auth/google/callback"

[[d1_databases]]
binding = "DB"
database_name = "novyra-preview-db"
database_id = "51e14038-5b81-49f8-83a1-4c5ba1f05bd8"
migrations_dir = "migrations-preview"

[[kv_namespaces]]
binding = "STORY_MEDIA"
id = "81ae79962a0c47778b8ca32fc9e35422"

[[durable_objects.bindings]]
name = "ROOM_HUB"
class_name = "RoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

[ai]
binding = "AI"


[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
