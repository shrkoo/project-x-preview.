name: CI

on:
  push:
    branches:
      - feature/homa-auth-part1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: set -o pipefail; npm install 2>&1 | tee -a ci-build.log

      - name: Check language autonyms
        shell: bash
        run: set -o pipefail; npm run test:language-autonyms 2>&1 | tee -a ci-build.log

      - name: Check authentication translations
        shell: bash
        run: set -o pipefail; npm run test:auth-translations 2>&1 | tee -a ci-build.log

      - name: Check regional formatters
        shell: bash
        run: set -o pipefail; npm run test:regional-preferences 2>&1 | tee -a ci-build.log

      - name: Check preview regional profile schema
        shell: bash
        run: set -o pipefail; npm run test:regional-profile-schema 2>&1 | tee -a ci-build.log

      - name: Check business preview APIs and multi-device sync
        shell: bash
        run: set -o pipefail; npm run test:business-preview 2>&1 | tee -a ci-build.log

      - name: Type-check
        shell: bash
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee -a ci-build.log

      - name: Build
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee -a ci-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build.log
          if-no-files-found: warn
