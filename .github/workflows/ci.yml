name: CI

on:
  push:
    branches:
      - feature/homa-auth-part1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install 2>&1 | tee -a ci-build.log

      - name: Check language autonyms
        run: npm run test:language-autonyms 2>&1 | tee -a ci-build.log

      - name: Type-check
        run: npx tsc --noEmit 2>&1 | tee -a ci-build.log

      - name: Build
        run: npm run build 2>&1 | tee -a ci-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build.log
          if-no-files-found: warn
