name: CI

on:
  push:
    branches:
      - feature/homa-auth-part1
  pull_request:
    branches:
      - feature/homa-auth-part1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repository currently has no committed npm lockfile. Generate one
      # on the runner so the required clean-install step can still use npm ci.
      - name: Generate temporary lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Check language autonyms
        run: npm run test:language-autonyms

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
