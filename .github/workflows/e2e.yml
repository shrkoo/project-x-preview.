name: Preview E2E

on:
  push:
    branches:
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build Preview app
        env:
          DEPLOY_TARGET: cloudflare-pages
          NEXT_PUBLIC_API_BASE: https://novyra-preview-api.projectx-novyratam.workers.dev
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: preview-test-site-key
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run auth API tests
        run: npm run test:auth-login
      - name: Run client auth hash tests
        run: npm run test:auth-client
      - name: Run money unit tests
        run: npm run test:money
      - name: Run money formatting guard
        run: npm run test:money-usage
      - name: Run responsive Playwright tests
        run: npx playwright test e2e/auth-flows.spec.ts e2e/responsive-locales.spec.ts e2e/transaction-sheet.spec.ts e2e/finance-sync.spec.ts e2e/finance-tombstones.spec.ts
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novyra-preview-e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
