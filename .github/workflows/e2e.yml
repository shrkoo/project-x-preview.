name: Preview E2E

on:
  push:
    branches:
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Preview app
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run auth API tests
        run: npm run test:auth-login
      - name: Run client auth hash tests
        run: npm run test:auth-client
      - name: Run money unit tests
        run: npm run test:money
      - name: Run money formatting guard
        run: npm run test:money-usage
      - name: Run responsive Playwright tests
        run: npx playwright test e2e/responsive-locales.spec.ts
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novyra-preview-e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
