name: Cloudflare Preview

on:
  push:
    branches:
      - feature/homa-auth-part1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-feature-homa-auth-part1
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test password login handler before deployment
        run: npm run test:auth-login

      - name: Configure isolated preview Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_DATABASE_ID: 51e14038-5b81-49f8-83a1-4c5ba1f05bd8
          PRODUCTION_D1_DATABASE_ID: 04aef3ef-8143-4fc2-af7b-7f40c06534e1
          CLOUDFLARE_WORKERS_SUBDOMAIN: projectx-novyratam
          PREVIEW_WORKER_URL: https://novyra-preview-api.projectx-novyratam.workers.dev
          PREVIEW_EMAIL_FROM: ${{ vars.PREVIEW_EMAIL_FROM }}
        run: |
          node -e "const fs=require('fs');const pPath='workers/api/wrangler.preview.toml';const p=fs.readFileSync(pPath,'utf8');const prod=fs.readFileSync('workers/api/wrangler.jsonc','utf8');const previewId=(p.match(/database_id\s*=\s*\"([^\"]+)\"/)||[])[1];const productionId=(prod.match(/\"database_id\"\s*:\s*\"([^\"]+)\"/)||[])[1];if(!previewId||!productionId||previewId===productionId)throw new Error('Refusing preview deployment: D1 database isolation check failed');let out=p.replaceAll('__PREVIEW_ACCOUNT_ID__',process.env.CLOUDFLARE_ACCOUNT_ID||'595c5761b6974e9f7ed15db0e5ffe3b8').replaceAll('__PREVIEW_D1_DATABASE_ID__',previewId).replaceAll('__PREVIEW_WORKER_URL__',process.env.PREVIEW_WORKER_URL);if(process.env.PREVIEW_EMAIL_FROM)out=out.replace('__PREVIEW_EMAIL_FROM__',process.env.PREVIEW_EMAIL_FROM);else out=out.replace(/EMAIL_FROM\s*=\s*\"__PREVIEW_EMAIL_FROM__\"\n/,'');fs.writeFileSync(pPath,out)"

      - name: Apply migrations to PREVIEW D1 only
        working-directory: workers/api
        run: npx wrangler d1 migrations apply novyra-preview-db --remote --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional preview secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          EMAIL_BRIDGE_URL: ${{ secrets.PREVIEW_EMAIL_BRIDGE_URL }}
          EMAIL_BRIDGE_SECRET: ${{ secrets.PREVIEW_EMAIL_BRIDGE_SECRET }}
          ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
        run: |
          set -e
          if [ -n "$GOOGLE_CLIENT_ID" ]; then printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --config wrangler.preview.toml; fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.preview.toml; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.preview.toml; fi
          if [ -n "$EMAIL_BRIDGE_URL" ]; then printf '%s' "$EMAIL_BRIDGE_URL" | npx wrangler secret put EMAIL_BRIDGE_URL --config wrangler.preview.toml; fi
          if [ -n "$EMAIL_BRIDGE_SECRET" ]; then printf '%s' "$EMAIL_BRIDGE_SECRET" | npx wrangler secret put EMAIL_BRIDGE_SECRET --config wrangler.preview.toml; fi
          if [ -n "$ADMIN_EMAIL" ]; then printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL --config wrangler.preview.toml; fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then echo "Google OAuth credentials supplied to Preview deployment."; else echo "Google OAuth credentials missing: both Client ID and Client Secret are required."; fi

      - name: Deploy preview API Worker
        working-directory: workers/api
        run: npx wrangler deploy --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: Smoke-test isolated preview API
        env:
          PREVIEW_WORKER_URL: https://novyra-preview-api.projectx-novyratam.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error "$PREVIEW_WORKER_URL/api/health")"
          echo "Preview API health payload: $response"
          node -e 'const d=JSON.parse(process.argv[1]);const required=["users","sessions","auth_rate_limits","signup_verification_codes","finance_transfers","finance_transactions"];if(d.ok!==true||d.service!=="novyra-api"||d.database!=="connected"||required.some(k=>d.tables?.[k]!==true)||d.bindings?.D1!==true||typeof d.secrets?.TURNSTILE!=="boolean"||typeof d.secrets?.EMAIL_PROVIDER!=="boolean"||typeof d.secrets?.GOOGLE_OAUTH!=="boolean"||d.configuration?.SESSION_SECRET_REQUIRED!==false)process.exit(1);console.log("Auth readiness:",JSON.stringify({D1:d.bindings.D1,Turnstile:d.secrets.TURNSTILE,EmailProvider:d.secrets.EMAIL_PROVIDER,GoogleOAuth:d.secrets.GOOGLE_OAUTH,SessionSecretRequired:d.configuration.SESSION_SECRET_REQUIRED}))' "$response"
          options_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request OPTIONS "$PREVIEW_WORKER_URL/auth/login")"
          test "$options_status" = "204" -o "$options_status" = "200"
          echo "Preview API D1 schema health and auth CORS preflight checks passed."

      - name: Smoke-test preview password login with an ephemeral test account
        working-directory: workers/api
        env:
          PREVIEW_WORKER_URL: https://novyra-preview-api.projectx-novyratam.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          email="novyra-preview-smoke@example.invalid"
          readarray -t credentials < <(node -e 'const c=require("node:crypto");const salt="0123456789abcdef0123456789abcdef";const hash=c.pbkdf2Sync("PreviewSmokePass123!",salt,100000,32,"sha256").toString("hex");console.log(salt);console.log("pbkdf2$100000$"+salt+"$"+hash)')
          salt="${credentials[0]}"
          password_hash="${credentials[1]}"
          cleanup() {
            npx wrangler d1 execute novyra-preview-db --remote --config wrangler.preview.toml --command "DELETE FROM users WHERE email='$email';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          insert_sql="INSERT INTO users (id,email,display_name,password_hash,password_salt,role,verified_at) VALUES ('preview-smoke-user','$email','Preview Smoke','$password_hash','$salt','user',CURRENT_TIMESTAMP) ON CONFLICT(email) DO UPDATE SET password_hash=excluded.password_hash,password_salt=excluded.password_salt,verified_at=CURRENT_TIMESTAMP;"
          npx wrangler d1 execute novyra-preview-db --remote --config wrangler.preview.toml --command "$insert_sql"
          status="$(curl --silent --show-error --output /tmp/login-response.json --write-out '%{http_code}' \
            --request POST "$PREVIEW_WORKER_URL/auth/login" \
            --header 'Content-Type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({email:process.argv[1],passwordHash:process.argv[2]}))' "$email" "$password_hash")")"
          test "$status" = "200"
          node -e 'const d=require("/tmp/login-response.json");if(!d.token||d.user?.email!=="novyra-preview-smoke@example.invalid"||!d.requestId&&d.code)process.exit(1);console.log("Preview login PASS for ephemeral test account; requestId:",d.requestId||"returned session")'
          echo "Preview password login succeeded with a real, temporary D1 account."
          token="$(node -e 'process.stdout.write(require("/tmp/login-response.json").token)')"
          PREVIEW_API_TOKEN="$token" node tests/finance-transfer-smoke.mjs

      - name: Build static frontend for preview API
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages
          NEXT_PUBLIC_API_BASE: https://novyra-preview-api.projectx-novyratam.workers.dev
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAGT3YeW3V72DTsmj

      - name: Deploy Pages preview only
        run: npx wrangler pages deploy out --project-name novyra --branch feature-homa-auth-part1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test deployed preview Pages site
        env:
          PREVIEW_PAGES_URL: https://feature-homa-auth-part1.novyra.pages.dev
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error "$PREVIEW_PAGES_URL/")"
          test -n "$html"
          echo "Preview Pages returned a successful HTML response."

      - name: Verify live Preview version stamp
        env:
          PREVIEW_PAGES_URL: https://feature-homa-auth-part1.novyra.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PREVIEW_PAGES_URL/version.json?verify=$GITHUB_SHA" --output /tmp/preview-version.json; then
              if node -e 'const d=require("/tmp/preview-version.json");if(d.commit!==process.env.GITHUB_SHA||d.branch!=="feature/homa-auth-part1")process.exit(1);console.log("Live Preview version:",d.shortCommit,d.builtAt)' ; then
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Live /version.json did not match $GITHUB_SHA" >&2
          cat /tmp/preview-version.json 2>/dev/null || true
          exit 1
