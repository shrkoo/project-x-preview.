name: Cloudflare Preview

on:
  push:
    branches:
      - feature/homa-auth-part1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-feature-homa-auth-part1
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: vars.PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure isolated preview Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_D1_DATABASE_ID: ${{ vars.PREVIEW_D1_DATABASE_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          PREVIEW_R2_BUCKET_NAME: ${{ vars.PREVIEW_R2_BUCKET_NAME }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          PREVIEW_WORKER_URL: https://novyra-api-preview.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
          PREVIEW_EMAIL_FROM: ${{ vars.PREVIEW_EMAIL_FROM }}
        run: |
          node -e "const fs=require('fs');if(!process.env.CLOUDFLARE_WORKERS_SUBDOMAIN)throw new Error('Set CLOUDFLARE_WORKERS_SUBDOMAIN');if(!process.env.PRODUCTION_D1_DATABASE_ID)throw new Error('Set PRODUCTION_D1_DATABASE_ID as a safety guard');if(process.env.PREVIEW_D1_DATABASE_ID===process.env.PRODUCTION_D1_DATABASE_ID)throw new Error('Refusing to run migrations: preview D1 ID equals production D1 ID');let p=fs.readFileSync('workers/api/wrangler.preview.toml','utf8');for(const [k,v] of Object.entries({__PREVIEW_ACCOUNT_ID__:process.env.CLOUDFLARE_ACCOUNT_ID,__PREVIEW_D1_DATABASE_ID__:process.env.PREVIEW_D1_DATABASE_ID,__PREVIEW_R2_BUCKET_NAME__:process.env.PREVIEW_R2_BUCKET_NAME,__PREVIEW_WORKER_URL__:process.env.PREVIEW_WORKER_URL,__PREVIEW_EMAIL_FROM__:process.env.PREVIEW_EMAIL_FROM})){if(!v)throw new Error('Missing '+k);p=p.replaceAll(k,v)}fs.writeFileSync('workers/api/wrangler.preview.toml',p)"

      - name: Apply migrations to PREVIEW D1 only
        working-directory: workers/api
        run: npx wrangler d1 migrations apply novyra-preview --remote --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional preview secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.PREVIEW_RESEND_API_KEY }}
          EMAIL_BRIDGE_URL: ${{ secrets.PREVIEW_EMAIL_BRIDGE_URL }}
          EMAIL_BRIDGE_SECRET: ${{ secrets.PREVIEW_EMAIL_BRIDGE_SECRET }}
          ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
        run: |
          set -e
          if [ -n "$GOOGLE_CLIENT_ID" ]; then printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --config wrangler.preview.toml; fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.preview.toml; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.preview.toml; fi
          if [ -n "$EMAIL_BRIDGE_URL" ]; then printf '%s' "$EMAIL_BRIDGE_URL" | npx wrangler secret put EMAIL_BRIDGE_URL --config wrangler.preview.toml; fi
          if [ -n "$EMAIL_BRIDGE_SECRET" ]; then printf '%s' "$EMAIL_BRIDGE_SECRET" | npx wrangler secret put EMAIL_BRIDGE_SECRET --config wrangler.preview.toml; fi
          if [ -n "$ADMIN_EMAIL" ]; then printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL --config wrangler.preview.toml; fi

      - name: Deploy preview API Worker
        working-directory: workers/api
        run: npx wrangler deploy --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build static frontend for preview API
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages
          NEXT_PUBLIC_API_BASE: https://novyra-api-preview.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev

      - name: Deploy Pages preview only
        run: npx wrangler pages deploy out --project-name novyra-preview --branch feature-homa-auth-part1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
